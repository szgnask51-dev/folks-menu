        function menuyuCiz() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            let currentCat = '';

            menuData.forEach(item => {
                if (item.k !== currentCat) {
                    currentCat = item.k;
                    const catHeader = document.createElement('h2');
                    catHeader.className = 'category-title';
                    catHeader.innerText = currentCat;
                    container.appendChild(catHeader);
                }

                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <div class="item-main">
                            <span class="item-name">${item.u}</span>
                            <span class="item-price">${item.f}</span>
                        </div>
                        ${item.a ? `<div class="item-desc">${item.a}</div>` : ''}
                    </div>
                    ${item.g ? `<img src="${item.g}" class="item-img" onclick="openModal('${item.g}')" alt="${item.u}">` : ''}
                `;
                container.appendChild(itemDiv);
            });
        }

        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imgModal').style.display = 'none';
        }
